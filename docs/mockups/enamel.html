<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tastebase — Enamel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&display=swap" rel="stylesheet">
<style>
  :root {
    --cobalt: #1d3fa6;
    --cobalt-deep: #142c78;
    --enamel: #fbfcff;
    --grout: #dfe4ef;
    --ink: #121a33;
    --dim: #5d6787;
    --chip: #f3c623;
  }
  * { box-sizing: border-box; }
  html, body { background: var(--grout); }
  body { margin: 0; color: var(--ink); font: 15px/1.5 "Archivo", system-ui, sans-serif; }
  a { color: inherit; text-decoration: none; }
  :focus-visible { outline: 3px solid var(--chip); outline-offset: 2px; }
  .wide { font-stretch: 125%; }

  .app { display: grid; grid-template-columns: 88px 1fr; }
  .rail { background: var(--cobalt); color: #fff; display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 22px 0; min-height: 100%; }
  .mark { width: 48px; height: 48px; border-radius: 14px; background: #fff; color: var(--cobalt); display: grid; place-items: center; font: 800 22px "Archivo"; font-stretch: 125%; margin-bottom: 18px; border: 3px solid var(--ink); }
  .ri { width: 64px; padding: 10px 0 8px; border-radius: 14px; text-align: center; font-size: 11.5px; font-weight: 600; color: #c9d4f5; }
  .ri svg { display: block; margin: 0 auto 4px; width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; }
  .ri.on { background: #fff; color: var(--cobalt); }
  .ri.add { margin-top: auto; background: var(--chip); color: var(--ink); }

  main { padding: 28px 36px 40px; }
  .title { display: flex; align-items: end; gap: 20px; }
  h1 { margin: 0; font-size: 52px; line-height: 1; font-weight: 800; font-stretch: 125%; letter-spacing: -.02em; }
  .title p { margin: 0 0 6px; color: var(--dim); }
  .searchrow { display: flex; gap: 12px; margin-top: 22px; }
  .search { flex: 1; background: var(--enamel); border: 3px solid var(--ink); border-radius: 16px; padding: 14px 18px; font-size: 17px; display: flex; gap: 10px; align-items: center; }
  .search b { background: var(--cobalt); color: #fff; border-radius: 8px; padding: 2px 10px; font-weight: 600; font-size: 14px; }
  .search span { color: var(--dim); }
  .sort { background: var(--enamel); border: 3px solid var(--ink); border-radius: 16px; padding: 14px 18px; font-weight: 600; }

  .tags { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 24px; }
  .tag { background: var(--enamel); border-radius: 10px; padding: 6px 12px; font-weight: 600; font-size: 14px; border: 2px solid transparent; }
  .tag.on { border-color: var(--cobalt); color: var(--cobalt); }
  .tag small { color: var(--dim); font-weight: 400; margin-left: 4px; }

  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; background: var(--grout); }
  .tile { background: var(--enamel); border-radius: 18px; overflow: hidden; display: flex; flex-direction: column; border: 3px solid var(--ink); }
  .motif { aspect-ratio: 16 / 10; background-color: var(--cobalt); position: relative; border-bottom: 3px solid var(--ink); }
  .motif.m1 { background-image: radial-gradient(circle at 50% 50%, var(--enamel) 0 18%, transparent 19%), radial-gradient(circle at 0 0, var(--enamel) 0 20%, transparent 21%), radial-gradient(circle at 100% 0, var(--enamel) 0 20%, transparent 21%), radial-gradient(circle at 0 100%, var(--enamel) 0 20%, transparent 21%), radial-gradient(circle at 100% 100%, var(--enamel) 0 20%, transparent 21%); background-size: 56px 56px; }
  .motif.m2 { background-image: repeating-linear-gradient(45deg, var(--enamel) 0 6px, transparent 6px 22px), repeating-linear-gradient(-45deg, var(--enamel) 0 6px, transparent 6px 22px); }
  .motif.m3 { background-image: radial-gradient(circle, var(--enamel) 0 30%, var(--cobalt) 31% 44%, var(--enamel) 45% 52%, transparent 53%); background-size: 48px 48px; }
  .motif.m4 { background-image: conic-gradient(from 45deg, var(--enamel) 0 25%, transparent 0 50%, var(--enamel) 0 75%, transparent 0); background-size: 40px 40px; }
  .motif .badge { position: absolute; left: 12px; top: 12px; background: var(--enamel); border: 2px solid var(--ink); border-radius: 999px; padding: 2px 10px; font-size: 12.5px; font-weight: 700; }
  .motif .heart { position: absolute; right: 12px; top: 12px; width: 32px; height: 32px; border-radius: 50%; background: var(--chip); border: 2px solid var(--ink); display: grid; place-items: center; font-size: 15px; }
  .info { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
  .info h3 { margin: 0; font-size: 18px; line-height: 1.15; font-weight: 700; font-stretch: 110%; }
  .info .meta { display: flex; justify-content: space-between; color: var(--dim); font-size: 13.5px; margin-top: auto; }
  .info .meta b { color: var(--ink); font-weight: 600; }
</style>
</head>
<body>
<div class="app">
  <nav class="rail">
    <div class="mark">T</div>
    <a class="ri" href="#"><svg viewBox="0 0 24 24"><path d="M4 5h16M4 12h16M4 19h10"/></svg>Recipes</a>
    <a class="ri on" href="#"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>Search</a>
    <a class="ri" href="#"><svg viewBox="0 0 24 24"><path d="M12 20s-7-4.5-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.5-7 10-7 10z"/></svg>Saved</a>
    <a class="ri" href="#"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>Recent</a>
    <a class="ri" href="#"><svg viewBox="0 0 24 24"><path d="M4 4h7l9 9-7 7-9-9z"/><circle cx="8.5" cy="8.5" r="1.5"/></svg>Tags</a>
    <a class="ri add" href="#"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Add</a>
  </nav>
  <main>
    <div class="title">
      <h1>Find a recipe</h1>
      <p>48 recipes from 4 cooks in this house</p>
    </div>
    <div class="searchrow">
      <div class="search">⌕ <b>chickpeas</b> <b>under 45 min</b> <span>add an ingredient, tag or cook</span></div>
      <div class="sort">Most cooked ▾</div>
    </div>
    <div class="tags">
      <span class="tag on">Vegetarian <small>21</small></span>
      <span class="tag">Weeknight <small>17</small></span>
      <span class="tag">Pantry <small>12</small></span>
      <span class="tag">Freezer-friendly <small>9</small></span>
      <span class="tag">Baking <small>8</small></span>
      <span class="tag">Feeds a crowd <small>6</small></span>
      <span class="tag">Only mine <small>11</small></span>
    </div>
    <div class="grid" id="grid"></div>
  </main>
</div>
<script>
const recipes = [
  ["Weeknight chana masala","Priya","30 min","m1","Indian",1],
  ["Charred leek & white bean soup","Theo","45 min","m3","French"],
  ["Chickpea & spinach shakshuka","Maya","35 min","m2","Levantine",1],
  ["Crispy chickpea grain bowl","Sam","25 min","m4","Bowls"],
  ["Hummus with spiced lamb","Theo","40 min","m3","Levantine"],
  ["Roast squash & chickpea tagine","Priya","45 min","m4","Moroccan",0,1],
  ["Pasta e ceci","Maya","30 min","m1","Italian",1],
  ["Smashed chickpea sandwich","Sam","10 min","m2","Lunch"],
];
document.getElementById("grid").innerHTML = recipes.map(([t,by,time,m,c,fav,priv]) => `
  <a href="#" class="tile">
    <div class="motif ${m}"><span class="badge">${priv?"Private":c}</span>${fav?'<span class="heart">♥</span>':""}</div>
    <div class="info"><h3>${t}</h3><div class="meta"><span>by <b>${by}</b></span><span>${time}</span></div></div>
  </a>`).join("");
</script>
</body>
</html>
